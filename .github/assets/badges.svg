<svg xmlns="http://www.w3.org/2000/svg" width="793" height="44" viewBox="0 0 793 44"
     role="img" aria-label="Astro 7.3, Tailwind CSS 4.3, 10 locales with RTL, code MIT, content All Rights Reserved">
  <title>项目徽章</title>
  <defs>
    <!-- 小型控件 L2 柔影：2px 3px 4px 0 rgba(0,0,0,.67) -->
    <filter id="badgeSoft" x="-30%" y="-40%" width="170%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.67" />
    </filter>
    <!-- 小型控件噪点：256 viewBox 平铺 70px ⇒ 有效频率 1.0，contrast(5) 线性近似 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0.333 0.333 0.333 0 0  0.333 0.333 0.333 0 0  0.333 0.333 0.333 0 0  0 0 0 1 0" />
      <feComponentTransfer><feFuncR type="linear" slope="5" intercept="-2" /><feFuncG type="linear" slope="5" intercept="-2" /><feFuncB type="linear" slope="5" intercept="-2" /></feComponentTransfer>
    </filter>
    <linearGradient id="badgeSheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="badgeInset" x1="0" y1="0" x2="0.7" y2="0.9">
      <stop offset="0" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <g>
    <rect x="6" y="6" width="236" height="32" rx="16" fill="#262626" filter="url(#badgeSoft)" />
    <rect x="7" y="8" width="236" height="32" rx="16" fill="rgba(245,245,245,0.20)" />
    <rect x="6" y="6" width="236" height="32" rx="16" fill="#262626"
          stroke="rgba(245,245,245,0.06)" stroke-width="1" />
    <g clip-path="url(#clipBadge6)">
      <rect x="6" y="6" width="236" height="32" filter="url(#grain)" opacity="0.20" style="mix-blend-mode:overlay" />
      <rect x="6" y="6" width="236" height="32" fill="url(#badgeInset)" />
      <rect x="6" y="6" width="236" height="32" fill="url(#badgeSheen)" opacity="0.28" />
    </g>
    <text x="124" y="27" font-size="14" font-weight="500" text-anchor="middle" fill="#F5F5F5"
          font-family="'MiSans','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">Astro 7.3 · Tailwind 4.3</text>
  </g>
  <clipPath id="clipBadge6"><rect x="6" y="6" width="236" height="32" rx="16" /></clipPath>
  
  <g>
    <rect x="254" y="6" width="168" height="32" rx="16" fill="#262626" filter="url(#badgeSoft)" />
    <rect x="255" y="8" width="168" height="32" rx="16" fill="rgba(245,245,245,0.20)" />
    <rect x="254" y="6" width="168" height="32" rx="16" fill="#262626"
          stroke="rgba(245,245,245,0.06)" stroke-width="1" />
    <g clip-path="url(#clipBadge254)">
      <rect x="254" y="6" width="168" height="32" filter="url(#grain)" opacity="0.20" style="mix-blend-mode:overlay" />
      <rect x="254" y="6" width="168" height="32" fill="url(#badgeInset)" />
      <rect x="254" y="6" width="168" height="32" fill="url(#badgeSheen)" opacity="0.28" />
    </g>
    <text x="338" y="27" font-size="14" font-weight="500" text-anchor="middle" fill="#F5F5F5"
          font-family="'MiSans','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">10 locales · RTL</text>
  </g>
  <clipPath id="clipBadge254"><rect x="254" y="6" width="168" height="32" rx="16" /></clipPath>
  
  <g>
    <rect x="434" y="6" width="353" height="32" rx="16" fill="#DE1300" filter="url(#badgeSoft)" />
    <rect x="435" y="8" width="353" height="32" rx="16" fill="#FF5C4D" />
    <rect x="434" y="6" width="353" height="32" rx="16" fill="#DE1300"
          stroke="rgba(245,245,245,0.15)" stroke-width="1" />
    <g clip-path="url(#clipBadge434)">
      <rect x="434" y="6" width="353" height="32" filter="url(#grain)" opacity="0.20" style="mix-blend-mode:overlay" />
      <rect x="434" y="6" width="353" height="32" fill="url(#badgeInset)" />
      <rect x="434" y="6" width="353" height="32" fill="url(#badgeSheen)" opacity="0.28" />
    </g>
    <text x="610.5" y="27" font-size="14" font-weight="500" text-anchor="middle" fill="#F5F5F5"
          font-family="'MiSans','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">Code MIT · Content All Rights Reserved</text>
  </g>
  <clipPath id="clipBadge434"><rect x="434" y="6" width="353" height="32" rx="16" /></clipPath>
</svg>
